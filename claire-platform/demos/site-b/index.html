<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atelier Lumière</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#eef1ec;background:#111917;font-family:Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:25px 6vw}strong{font-size:20px;letter-spacing:.08em}nav{display:flex;gap:24px}a{color:inherit;text-decoration:none}.hero{display:grid;grid-template-columns:1fr 1fr;min-height:82vh;padding:4vw 6vw 7vw;gap:5vw;align-items:end}.image{align-self:stretch;border-radius:4px;background:radial-gradient(circle at 62% 35%,#d8c3ae 0 8%,transparent 9%),linear-gradient(135deg,#384b46,#b78365)}small{color:#b9d0c7;letter-spacing:.16em}h1{margin:20px 0;font:64px/.98 Georgia,serif}p{font-size:17px;line-height:1.7;color:#bdc7c2}.button{display:inline-block;margin-top:18px;padding:13px 20px;border:1px solid #80948d}@media(max-width:700px){nav{display:none}.hero{grid-template-columns:1fr;padding:8vw 6vw}.image{min-height:330px;order:2}h1{font-size:46px}}
  </style>
</head>
<body>
  <header><strong>ATELIER LUMIÈRE</strong><nav><a href="#">Portraits</a><a href="#">Marques</a><a href="#">Le studio</a></nav></header>
  <main class="hero">
    <div><small>STUDIO PHOTO INDÉPENDANT</small><h1>Votre histoire, dans la lumière.</h1><p>Un studio fictif pour les portraits et les identités de marque. Décrivez votre projet à Claire avant l’échange avec l’atelier.</p><a class="button" href="#">Voir le portfolio</a></div>
    <div class="image" aria-label="Composition photographique abstraite"></div>
  </main>
  <script defer src="http://localhost:8787/claire-embed.js" data-tenant="atelier-lumiere" data-origin="http://localhost:4174"></script>
</body>
</html>
